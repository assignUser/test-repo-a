name: Dev PR
on:
  workflow_dispatch:
    inputs:
      opt:
        default: "5"
  pull_request:

jobs:
  get:
    runs-on: ubuntu-latest
    env:
      VAR1: ""
      VAR2: ${{ github.event.push }}
    steps:
      - shell: python
        run: |
          import os
          os.getenv("VAR1") is None
          os.getenv("VAR2") is None
                    
