name: Dev PR
on:
  pull_request:
  
permissions:
  contents: read
  actions: read

jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - env:
          EXTRA_CMAKE_FLAGS: > 
             -DVELOX_ENABLE_ARROW=ON
             -DVELOX_MONO_LIBRARY=ON
             -DVELOX_BUILD_PYTHON_PACKAGE=ON

        run: echo $EXTRA_CMAKE_FLAGS
