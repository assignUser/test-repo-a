name: Dev PR
on:
  workflow_dispatch:
  pull_request:

jobs:
  get:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [macos-15-intel, macos-15]
    steps:
      - uses: actions/setup-python@v6
      - run: python -m sysconfig | grep MACOSX_DEPLOYMENT_TARGET
                    
