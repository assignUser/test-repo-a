name: Dev PR
on:
  pull_request:

jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo test
  second:
    if: false
    needs: get
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo test
  third:
    if: ${{ !cancelled() || (needs.get.result == 'success' && needs.second.result == 'skipped') }}
    needs: [second, get]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo test
