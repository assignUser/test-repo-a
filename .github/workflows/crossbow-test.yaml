name: Dev PR
on:
  pull_request:
  
permissions:
  contents: read
  actions: read

jobs:
  get:
    runs-on: windows-latest
    steps:
      - env:
          VERSION: "20.0.0"
          RC: "0"
        shell: cmd
        run: |
          echo "apache-arrow-%VERSION%-rc%RC%"
          set TAG=apache-arrow-%VERSION%-rc%RC%
          echo Tag: %TAG%

        
