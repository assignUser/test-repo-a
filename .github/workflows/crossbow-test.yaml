name: Dev PR
on:
  pull_request:
  
permissions:
  contents: read
  actions: write

jobs:
  get:
    runs-on: ubuntu-latest
    outputs:
      build-id: ${{ steps.build-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        id: build-upload
        with:
          name: build
          path: ${{ github.workspace }}
  remove:
    needs: get
    runs-on: ubuntu-latest
    steps:
      - env:
          ARTIFACT_ID: ${{ needs.get.outputs.build-id }}
        run: |
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /repos/assignUser/test-repo-a/actions/artifacts/$ARTIFACT_ID
    
          
