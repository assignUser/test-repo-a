name: Dev PR
on:
  workflow_dispatch:
  pull_request:

jobs:        
  step1:
    name: Another Name
    runs-on: ubuntu-latest
    steps:
      - id: step-a
        run: echo hi
      - if: ${{ steps.step-a.outputs.foo }}
        run: echo bar
      - id: step-b
        run: echo foo=bar >> $GITHUB_OUTPUT      
      - if: ${{ steps.step-b.outputs.foo }}
        run: echo bar

                    
