name: Dev PR
on:
  pull_request:
  
permissions:
  contents: read
  actions: read

jobs:
  get:
    runs-on: ubuntu-latest
    outputs:
      build-id: ${{ steps.build-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        id: build-upload
        with:
          name: build
          path: ${{ github.workspace }}
  remove:
    needs: get
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: build
          overwrite: true
          path: ~/.bashrc
          
