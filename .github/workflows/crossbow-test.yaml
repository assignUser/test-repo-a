name: Dev PR
on:
  pull_request:

jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
              # Configuration
              TO="builds@arrow.apache.org"
              SUBJECT="Nightly Report Test Mail"
              BODY="Testing delivery via local MTA."
              
              # Send the email
              echo -e "$BODY" | mail -s "$SUBJECT" "$TO"
